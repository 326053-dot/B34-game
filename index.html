<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rich Suika Game</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Matter.js (2D Physics Engine) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <!-- Tone.js (Sound Effects) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            overscroll-behavior: none; /* Prevent pull-to-refresh on mobile */
            touch-action: none; /* Disable default touch actions */
        }
        #gameCanvas {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            /* 背景を鮮やかなブルー系にしてフルーツのコントラストを上げる */
            background: linear-gradient(to bottom, #89f7fe 0%, #66a6ff 100%);
        }
        .ui-layer {
            pointer-events: none;
        }
        .interactive-btn {
            pointer-events: auto;
        }
    </style>
</head>
<body class="bg-gray-900 h-screen w-screen flex items-center justify-center font-sans overflow-hidden select-none">

    <!-- Game Container -->
    <div id="game-container" class="relative flex flex-col items-center justify-center w-full max-w-md h-full max-h-[800px] p-2">
        
        <!-- Header / Scores -->
        <div class="w-full flex justify-between items-center mb-2 px-4 ui-layer">
            <div class="bg-white/90 backdrop-blur-sm rounded-xl px-4 py-2 shadow-lg flex items-center gap-2">
                <span class="text-sm font-bold text-gray-600">SCORE</span>
                <span id="scoreText" class="text-2xl font-black text-orange-500">0</span>
            </div>
            <div class="bg-white/90 backdrop-blur-sm rounded-xl px-4 py-2 shadow-lg flex items-center gap-2">
                <span class="text-sm font-bold text-gray-600">NEXT</span>
                <div id="nextFruitDisplay" class="text-2xl">🍒</div>
            </div>
        </div>

        <!-- Canvas Wrapper -->
        <div class="relative w-full aspect-[2/3] max-w-[400px]">
            <canvas id="gameCanvas" class="w-full h-full"></canvas>
            
            <!-- Start Screen Overlay -->
            <div id="startScreen" class="absolute inset-0 bg-black/60 rounded-xl flex flex-col items-center justify-center z-10 interactive-btn backdrop-blur-sm transition-opacity duration-300">
                <h1 class="text-5xl font-black text-white mb-2 drop-shadow-lg text-center">SUIKA<br>GAME</h1>
                <p class="text-white/80 mb-8 text-sm">タップまたはクリックしてフルーツを落とす</p>
                <button id="startBtn" class="bg-gradient-to-r from-orange-400 to-red-500 text-white font-bold py-3 px-10 rounded-full shadow-[0_0_20px_rgba(249,115,22,0.5)] transform hover:scale-105 active:scale-95 transition-all text-xl">
                    PLAY
                </button>
            </div>

            <!-- Game Over Overlay -->
            <div id="gameOverScreen" class="absolute inset-0 bg-black/70 rounded-xl flex flex-col items-center justify-center z-20 hidden interactive-btn backdrop-blur-md">
                <h2 class="text-4xl font-black text-red-400 mb-2 drop-shadow-lg">GAME OVER</h2>
                <div class="bg-white/10 rounded-xl p-4 mb-6 text-center w-3/4">
                    <p class="text-gray-300 text-sm mb-1">FINAL SCORE</p>
                    <p id="finalScore" class="text-5xl font-black text-white">0</p>
                </div>
                <button id="restartBtn" class="bg-white text-gray-900 font-bold py-3 px-10 rounded-full shadow-lg transform hover:scale-105 active:scale-95 transition-all text-lg">
                    RETRY
                </button>
            </div>
        </div>
        
    </div>

<script>
window.onload = () => {
    // --- Configuration & Constants ---
    const GAME_WIDTH = 400;
    const GAME_HEIGHT = 600;
    const WALL_THICKNESS = 40;
    const GAME_OVER_Y = 100;

    // Fruit definitions (より鮮やかではっきりした色に変更)
    const FRUITS = [
        { level: 0, emoji: '🍒', radius: 14, color: '#FF1744', points: 1 },
        { level: 1, emoji: '🍓', radius: 20, color: '#FF5252', points: 3 },
        { level: 2, emoji: '🍇', radius: 28, color: '#D500F9', points: 6 },
        { level: 3, emoji: '🍊', radius: 36, color: '#FF9100', points: 10 },
        { level: 4, emoji: '🍎', radius: 46, color: '#D50000', points: 15 },
        { level: 5, emoji: '🍐', radius: 58, color: '#AEEA00', points: 21 },
        { level: 6, emoji: '🍑', radius: 72, color: '#F50057', points: 28 },
        { level: 7, emoji: '🍍', radius: 88, color: '#FFEA00', points: 36 },
        { level: 8, emoji: '🍈', radius: 106, color: '#00E676', points: 45 },
        { level: 9, emoji: '🍉', radius: 126, color: '#C62828', points: 55 },
        { level: 10, emoji: '🌟', radius: 150, color: '#FFD600', points: 100 }
    ];

    // --- State Variables ---
    let score = 0;
    let currentFruit = null;
    let nextFruitIndex = 0;
    let isGameOver = false;
    let canDrop = true;
    let particles = [];
    let mouseX = GAME_WIDTH / 2;
    let animationFrameId;
    let synth; // Tone.js synthesizer

    // --- DOM Elements ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('scoreText');
    const nextFruitDisplay = document.getElementById('nextFruitDisplay');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const finalScoreText = document.getElementById('finalScore');

    // High resolution canvas setup
    canvas.width = GAME_WIDTH;
    canvas.height = GAME_HEIGHT;

    // --- Matter.js Setup ---
    const Engine = Matter.Engine,
          Render = Matter.Render,
          Runner = Matter.Runner,
          Bodies = Matter.Bodies,
          Composite = Matter.Composite,
          Events = Matter.Events,
          Body = Matter.Body;

    const engine = Engine.create();
    const world = engine.world;
    // Set slightly higher gravity for satisfying drops
    engine.gravity.y = 1.2;

    const runner = Runner.create();

    // Walls (Bottom, Left, Right)
    const wallOptions = { isStatic: true, render: { visible: false }, friction: 0.1 };
    const ground = Bodies.rectangle(GAME_WIDTH / 2, GAME_HEIGHT + WALL_THICKNESS / 2, GAME_WIDTH * 2, WALL_THICKNESS, wallOptions);
    const leftWall = Bodies.rectangle(-WALL_THICKNESS / 2, GAME_HEIGHT / 2, WALL_THICKNESS, GAME_HEIGHT * 2, wallOptions);
    const rightWall = Bodies.rectangle(GAME_WIDTH + WALL_THICKNESS / 2, GAME_HEIGHT / 2, WALL_THICKNESS, GAME_HEIGHT * 2, wallOptions);
    Composite.add(world, [ground, leftWall, rightWall]);

    // --- Audio Setup (Tone.js) ---
    function initAudio() {
        if(!synth) {
            synth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "sine" },
                envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 }
            }).toDestination();
            synth.volume.value = -10;
        }
    }

    function playMergeSound(level) {
        if(!synth) return;
        // Higher pitch for smaller fruits, lower for larger
        const notes = ["C5", "D5", "E5", "G5", "A5", "C6", "D6", "E6", "G6", "A6", "C7"];
        const note = notes[Math.min(level, notes.length - 1)];
        synth.triggerAttackRelease(note, "8n");
    }

    function playPopSound() {
        if(!synth) return;
        synth.triggerAttackRelease("C4", "16n");
    }

    // --- Core Functions ---

    function getRandomNextFruit() {
        // Next fruit is between level 0 (Cherry) and 4 (Apple)
        return Math.floor(Math.random() * 4);
    }

    function spawnCurrentFruit() {
        const fruitData = FRUITS[nextFruitIndex];
        mouseX = Math.max(fruitData.radius, Math.min(GAME_WIDTH - fruitData.radius, mouseX));
        // Create a static body at the top for aiming
        currentFruit = Bodies.circle(mouseX, 40, fruitData.radius, {
            isStatic: true,
            isSensor: true,
            fruitLevel: fruitData.level,
            label: 'currentFruit'
        });
        Composite.add(world, currentFruit);
        
        // Update Next UI
        nextFruitIndex = getRandomNextFruit();
        nextFruitDisplay.innerText = FRUITS[nextFruitIndex].emoji;
    }

    function dropFruit() {
        if (!canDrop || !currentFruit || isGameOver) return;
        
        canDrop = false;
        playPopSound();

        // Convert the static aiming fruit to a physical falling fruit
        Body.setStatic(currentFruit, false);
        currentFruit.isSensor = false;
        currentFruit.label = 'fruit';
        
        // Add physical properties
        currentFruit.restitution = 0.2;
        currentFruit.friction = 0.1;
        currentFruit.density = 0.001 * (currentFruit.fruitLevel + 1);

        currentFruit = null;

        // Cooldown before next fruit
        setTimeout(() => {
            if (!isGameOver) {
                spawnCurrentFruit();
                canDrop = true;
            }
        }, 1000);
    }

    function addParticles(x, y, color) {
        for (let i = 0; i < 15; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                radius: Math.random() * 4 + 2,
                color: color,
                alpha: 1,
                decay: Math.random() * 0.02 + 0.02
            });
        }
    }

    function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= p.decay;
            if (p.alpha <= 0) {
                particles.splice(i, 1);
            }
        }
    }

    function drawParticles() {
        particles.forEach(p => {
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
            ctx.restore();
        });
    }

    // --- Collision Logic ---
    Events.on(engine, 'collisionStart', (event) => {
        const pairs = event.pairs;
        const mergesThisFrame = []; // Prevent multiple merges of same object

        for (let i = 0; i < pairs.length; i++) {
            const bodyA = pairs[i].bodyA;
            const bodyB = pairs[i].bodyB;

            if (bodyA.label === 'fruit' && bodyB.label === 'fruit') {
                if (bodyA.fruitLevel === bodyB.fruitLevel && bodyA.fruitLevel < FRUITS.length - 1) {
                    
                    if (bodyA.isMerging || bodyB.isMerging) continue;
                    
                    bodyA.isMerging = true;
                    bodyB.isMerging = true;

                    mergesThisFrame.push({ bodyA, bodyB, level: bodyA.fruitLevel });
                }
            }
        }

        // Process merges
        mergesThisFrame.forEach(merge => {
            const { bodyA, bodyB, level } = merge;
            const newLevel = level + 1;
            const fruitData = FRUITS[newLevel];

            // Calculate midpoint for new fruit
            const midX = (bodyA.position.x + bodyB.position.x) / 2;
            const midY = (bodyA.position.y + bodyB.position.y) / 2;

            // Remove old bodies
            Composite.remove(world, [bodyA, bodyB]);

            // Add new fruit
            const newFruit = Bodies.circle(midX, midY, fruitData.radius, {
                label: 'fruit',
                fruitLevel: newLevel,
                restitution: 0.2,
                friction: 0.1,
                density: 0.001 * (newLevel + 1)
            });
            Composite.add(world, newFruit);

            // Visual and Audio Effects
            addParticles(midX, midY, fruitData.color);
            playMergeSound(newLevel);

            // Update Score
            score += fruitData.points;
            scoreText.innerText = score;
        });
    });

    // --- Game Loop (Custom Render) ---
    function gameLoop() {
        if (isGameOver) return;
        animationFrameId = requestAnimationFrame(gameLoop);
        
        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // Draw Game Over Line (Dashed red line)
        ctx.beginPath();
        ctx.setLineDash([10, 10]);
        ctx.moveTo(0, GAME_OVER_Y);
        ctx.lineTo(GAME_WIDTH, GAME_OVER_Y);
        ctx.strokeStyle = 'rgba(255, 0, 0, 0.3)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]);

        // Get all bodies
        const bodies = Composite.allBodies(world);

        // Draw bodies
        bodies.forEach(body => {
            if (body.label === 'fruit' || body.label === 'currentFruit') {
                const fruit = FRUITS[body.fruitLevel];
                
                ctx.save();
                ctx.translate(body.position.x, body.position.y);
                ctx.rotate(body.angle);
                
                // --- 立体的な果物の描画 ---
                
                // ドロップシャドウ
                ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
                ctx.shadowBlur = fruit.radius * 0.25;
                ctx.shadowOffsetY = fruit.radius * 0.15;

                // ベースの円 (立体的なグラデーション)
                const grad = ctx.createRadialGradient(
                    -fruit.radius * 0.25, -fruit.radius * 0.25, fruit.radius * 0.1, // 光源を左上に
                    0, 0, fruit.radius
                );
                grad.addColorStop(0, '#ffffff'); // 強いハイライト
                grad.addColorStop(0.3, fruit.color); // メインカラー
                grad.addColorStop(0.8, fruit.color); // メインカラーを維持
                grad.addColorStop(1, 'rgba(0,0,0,0.3)'); // 縁を暗くして球体感を出す

                ctx.beginPath();
                ctx.arc(0, 0, fruit.radius, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                
                // 次の描画に影響しないようシャドウをリセット
                ctx.shadowColor = 'transparent';

                // 反射光（右下の薄いハイライト）を追加してツヤ感を強調
                ctx.beginPath();
                ctx.arc(fruit.radius * 0.2, fruit.radius * 0.2, fruit.radius * 0.7, 0, Math.PI * 2);
                const highlightGrad = ctx.createRadialGradient(
                    fruit.radius * 0.4, fruit.radius * 0.4, 0,
                    fruit.radius * 0.2, fruit.radius * 0.2, fruit.radius * 0.7
                );
                highlightGrad.addColorStop(0, 'rgba(255,255,255,0.35)');
                highlightGrad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = highlightGrad;
                ctx.fill();

                // 縁の線（よりくっきりさせる）
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.stroke();

                // Draw Emoji (少しだけ小さくして枠内に綺麗に収める)
                ctx.font = `${fruit.radius * 1.0}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // slight offset to perfectly center emojis visually
                ctx.fillText(fruit.emoji, 0, fruit.radius * 0.05);
                
                ctx.restore();
            }
        });

        // Update and draw particles
        updateParticles();
        drawParticles();

        // Game Over Check
        checkGameOver(bodies);
    }

    let gameOverCounter = 0;
    function checkGameOver(bodies) {
        let isAnyOverLine = false;
        
        for (let i = 0; i < bodies.length; i++) {
            const body = bodies[i];
            if (body.label === 'fruit') {
                const fruit = FRUITS[body.fruitLevel];
                // Check if top of the fruit is above the line
                if (body.position.y - fruit.radius < GAME_OVER_Y) {
                    // Make sure it's settled (not just bouncing high momentarily)
                    if (Math.abs(body.velocity.y) < 0.5 && Math.abs(body.velocity.x) < 0.5) {
                        isAnyOverLine = true;
                        break;
                    }
                }
            }
        }

        if (isAnyOverLine) {
            gameOverCounter++;
            // Require it to be over the line for approx 1.5 seconds (at 60fps)
            if (gameOverCounter > 90) {
                triggerGameOver();
            }
        } else {
            gameOverCounter = 0; // Reset if it falls back down
        }
    }

    function triggerGameOver() {
        isGameOver = true;
        Runner.stop(runner);
        cancelAnimationFrame(animationFrameId);
        
        finalScoreText.innerText = score;
        gameOverScreen.classList.remove('hidden');
        if(synth) synth.triggerAttackRelease("G3", "2n");
    }

    function startGame() {
        initAudio();
        Tone.start();

        // Reset state
        Composite.clear(world);
        Engine.clear(engine);
        Composite.add(world, [ground, leftWall, rightWall]);
        
        score = 0;
        scoreText.innerText = '0';
        isGameOver = false;
        canDrop = true;
        gameOverCounter = 0;
        particles = [];
        nextFruitIndex = getRandomNextFruit();
        
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        
        Runner.run(runner, engine);
        spawnCurrentFruit();
        gameLoop();
    }

    // --- Input Handling ---
    function handleMove(clientX) {
        if (!canDrop || !currentFruit || isGameOver) return;
        
        // Calculate position relative to canvas
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        let x = (clientX - rect.left) * scaleX;
        
        // Clamp to walls taking fruit radius into account
        const radius = FRUITS[currentFruit.fruitLevel].radius;
        mouseX = Math.max(radius, Math.min(GAME_WIDTH - radius, x));
        
        Body.setPosition(currentFruit, { x: mouseX, y: currentFruit.position.y });
    }

    // Mouse Events
    canvas.addEventListener('mousemove', (e) => handleMove(e.clientX));
    canvas.addEventListener('mousedown', dropFruit);

    // Touch Events
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault(); // Prevent scrolling
        handleMove(e.touches[0].clientX);
    }, { passive: false });
    
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        handleMove(e.touches[0].clientX);
    }, { passive: false });
    
    canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        dropFruit();
    }, { passive: false });

    // Buttons
    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    // Initial render (background)
    ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
};
</script>
</body>
</html>
